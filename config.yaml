rules:
  - PROCESS-NAME,com.tencent.ig,默认代理
  - RULE-SET,ziji,默认代理
  - RULE-SET,private_ip,国内网络,no-resolve
  - RULE-SET,private_domain,国内网络
  - RULE-SET,cn_domain,国内网络
  - RULE-SET,cn_ip,国内网络
  - RULE-SET,zijign,国内网络
  - RULE-SET,googlefcm,GoogleFCM
  - RULE-SET,fakeipfilter_domain,国内网络
